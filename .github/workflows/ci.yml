name: CI

on:
    push:
        branches:
            - main
            - develop
            - feature/**
    pull_request:

jobs:
    clang-format:
        name: Clang Format Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Install clang-format
              run: sudo apt-get update && sudo apt-get install -y clang-format

            - name: C++ format check
              shell: bash
              run: |
                  set -euo pipefail
                  dirs=()
                  for d in operators applications tests src deps; do
                    if [ -d "$d" ]; then
                      dirs+=("$d")
                    fi
                  done

                  if [ ${#dirs[@]} -eq 0 ]; then
                    echo "No source directories found for clang-format check"
                    exit 0
                  fi

                  find "${dirs[@]}" -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
                    | xargs -0 -r clang-format --dry-run --Werror

    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      compiler_name: gcc
                      cc: gcc
                      cxx: g++
                    - os: macos-latest
                      compiler_name: clang
                      cc: clang
                      cxx: clang++
                    - os: windows-latest
                      compiler_name: msvc

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Cache Conan packages
              uses: actions/cache@v4
              with:
                  path: ~/.conan2
                  key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'deps/video-viewer/conanfile.txt') }}
                  restore-keys: |
                      conan-${{ runner.os }}-

            - name: Install compiler (Linux)
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y gcc g++ ninja-build

            - name: Install compiler tools (macOS)
              if: runner.os == 'macOS'
              run: brew install ninja

            - name: Install Conan and jinja2
              run: python -m pip install --upgrade pip conan jinja2

            - name: Detect Conan profile
              run: conan profile detect --force

            - name: Conan install
              env:
                  CC: ${{ matrix.cc }}
                  CXX: ${{ matrix.cxx }}
              run: conan install . -b missing

            - name: Configure CMake (Windows/MSVC)
              if: runner.os == 'Windows'
              run: cmake --preset conan-default

            - name: Configure CMake (Linux/macOS)
              if: runner.os != 'Windows'
              run: cmake --preset conan-release

            - name: Build
              run: cmake --build --preset conan-release
